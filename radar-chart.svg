<svg viewBox="0 0 400 400" width="360" height="360" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circle boundary -->
  <circle cx="200" cy="200" r="190" stroke="#374151" stroke-width="6" fill="none" />
  <!-- Concentric rings -->
  <circle cx="200" cy="200" r="140" stroke="#475569" stroke-width="1.5" fill="none" />
  <circle cx="200" cy="200" r="100" stroke="#475569" stroke-width="1" fill="none" />
  <circle cx="200" cy="200" r="60" stroke="#475569" stroke-width="1" fill="none" />
  <!-- Axis lines (pentagon for 5 skills) -->
  <g stroke="#475569" stroke-width="1" stroke-dasharray="3 3">
    <line x1="200" y1="200" x2="200" y2="10" />
    <line x1="200" y1="200" x2="370" y2="131" />
    <line x1="200" y1="200" x2="305" y2="342" />
    <line x1="200" y1="200" x2="95" y2="342" />
    <line x1="200" y1="200" x2="30" y2="131" />
  </g>
  <!-- Outer ticks (12 ticks for granularity) -->
  <g stroke="#64748b" stroke-width="2">
    <line x1="200" y1="10" x2="200" y2="25" />
    <line x1="200" y1="10" x2="200" y2="20" transform="rotate(30,200,200)" />
    <line x1="200" y1="10" x2="200" y2="20" transform="rotate(60,200,200)" />
    <line x1="200" y1="10" x2="200" y2="20" transform="rotate(90,200,200)" />
    <line x1="200" y1="10" x2="200" y2="20" transform="rotate(120,200,200)" />
    <line x1="200" y1="10" x2="200" y2="25" transform="rotate(150,200,200)" />
    <line x1="200" y1="10" x2="200" y2="20" transform="rotate(180,200,200)" />
    <line x1="200" y1="10" x2="200" y2="20" transform="rotate(210,200,200)" />
    <line x1="200" y1="10" x2="200" y2="20" transform="rotate(240,200,200)" />
    <line x1="200" y1="10" x2="200" y2="20" transform="rotate(270,200,200)" />
    <line x1="200" y1="10" x2="200" y2="20" transform="rotate(300,200,200)" />
    <line x1="200" y1="10" x2="200" y2="25" transform="rotate(330,200,200)" />
  </g>
  <!-- Skill labels -->
  <text x="200" y="40" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="monospace">Web Dev</text>
  <text x="345" y="125" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="monospace">ML</text>
  <text x="290" y="330" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="monospace">Gen AI</text>
  <text x="110" y="330" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="monospace">DSA</text>
  <text x="55" y="125" text-anchor="middle" fill="#94a3b8" font-size="10" font-family="monospace">Others</text>
  <!-- Radar data polygon (skill proficiency) -->
  <polygon
    points="200,30 300,160 260,270 140,280 100,150"
    fill="rgba(0,255,0,0.35)"
    stroke="#00ff00"
    stroke-width="3"/>
  <!-- Center dot -->
  <circle cx="200" cy="200" r="6" fill="#00ff00" />
</svg>
